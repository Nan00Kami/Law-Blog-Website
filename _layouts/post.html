<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | Lex Mercatoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbfbf9;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #575757;
      --border: #e8e6e1;
      --accent: #112233;
      --accent-gold: #9e7b4f;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-main); font-family: var(--font-sans); line-height: 1.8; }
    .container { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; }
    header { border-bottom: 1px solid var(--border); padding: 1.5rem 0; margin-bottom: 3.5rem; }
    .nav-back { text-decoration: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
    .nav-back:hover { color: var(--accent); }
    .post-meta { display: flex; gap: 0.75rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 1rem; }
    .post-tag { color: var(--accent-gold); font-weight: 600; }
    h1.article-title { font-family: var(--font-serif); font-size: 2.5rem; line-height: 1.25; color: var(--accent); margin-bottom: 2rem; }
    .post-content { font-size: 1.05rem; color: #222; }
    .post-content h2 { font-family: var(--font-serif); font-size: 1.7rem; color: var(--accent); margin: 2.5rem 0 1rem; }
    .post-content h3 { font-size: 1.25rem; margin: 2rem 0 0.75rem; color: var(--accent); }
    .post-content p { margin-bottom: 1.5rem; }
    .post-content blockquote { border-left: 3px solid var(--accent-gold); padding-left: 1.25rem; margin: 1.75rem 0; font-style: italic; color: var(--text-muted); }
    footer { border-top: 1px solid var(--border); padding: 3rem 0; margin-top: 5rem; font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="nav-back">&larr; Back to Lex Mercatoria</a>
    </div>
  </header>
  <main class="container">
    <article>
      <div class="post-meta">
        <span class="post-tag">{{ page.jurisdiction }}</span>
        <span>&bull;</span>
        <span>{{ page.date | date: "%B %d, %Y" }}</span>
      </div>
      <h1 class="article-title">{{ page.title }}</h1>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>
  <footer>
    <div class="container">
      &copy; {{ site.time | date: "%Y" }} Lex Mercatoria. Published for academic and analytical discourse.
    </div>
  </footer>
</body>
</html>
